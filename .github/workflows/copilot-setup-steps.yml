name: 'Copilot Setup Steps'

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Vite 8 requires Node ^20.19 || >=22.12, Vitest 5 ^22.12 || >=24.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack (yarn 4.x)
        run: corepack enable

      # The app lives at the repository root (package.json, yarn.lock).
      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript check
        run: yarn run build

      - name: Run linter
        run: yarn run lint

      - name: Format check
        run: yarn run format:check
