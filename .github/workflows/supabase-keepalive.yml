name: 'Supabase keep-alive'

on:
  schedule:
    # Free tier pauses the project after ~7 days idle.
    # Every 3 days = one missed run is still tolerated.
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/game_version?select=code&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
