name: 'CI'

# Runs on every PR into develop, and again on develop itself once merged.
# Release PRs are opened with GITHUB_TOKEN, which does not trigger
# pull_request workflows: the push runs keep develop's own state checked
# before its release PR is merged.
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same major as package.json engines (Vercel) and the Docker image.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Enable Corepack (yarn 4.x)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build (TypeScript + Vite)
        run: yarn run build

      - name: Lint
        run: yarn run lint

      - name: Format check
        run: yarn run format:check

      - name: Tests
        run: yarn run test

  # The production image builds and serves the app (front, API docs, health).
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dreadcast-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Unreachable database: the health check must report it (503), the
      # rest must still be served.
      - name: Smoke test without database
        run: |
          docker run -d --name app -p 3000:3000 \
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:9/ci \
            -e SIMULATOR_SUPABASE_URL=http://127.0.0.1:9 \
            -e SIMULATOR_SUPABASE_ANON_KEY=ci \
            dreadcast-simulator:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/api/docs && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/ | grep -q '<div id="root"'
          curl -sf http://127.0.0.1:3000/communaute | grep -q '<div id="root"'
          curl -sf http://127.0.0.1:3000/api/openapi.json | grep -q 'Dreadcast Simulator API'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/missing.js)" = 404

      # Real Postgres 17, provisioned like forge-pg (the application role is
      # not a superuser): the container migrates it at startup, then serves.
      - name: Smoke test with Postgres 17
        run: |
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_PASSWORD=ci postgres:17-alpine
          # Over TCP: the image first runs a temporary server for its init
          # (Unix socket only), then restarts it; only the final server
          # listens on TCP.
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -q && break
            sleep 1
          done
          # One -c per statement: CREATE DATABASE cannot run in the implicit
          # transaction of a multi-statement -c.
          docker exec pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dc_app LOGIN PASSWORD 'ci'" \
            -c "CREATE ROLE anon NOLOGIN NOINHERIT" \
            -c "CREATE ROLE authenticated NOLOGIN NOINHERIT" \
            -c "GRANT anon, authenticated TO dc_app" \
            -c "CREATE DATABASE dc_simulateur OWNER dc_app"
          docker run -d --name app-pg --network ci -p 3001:3000 \
            -e DATABASE_URL=postgres://dc_app:ci@pg:5432/dc_simulateur \
            -e DB_MIGRATE=1 \
            -e SIMULATOR_SUPABASE_URL=http://127.0.0.1:9 \
            -e SIMULATOR_SUPABASE_ANON_KEY=ci \
            dreadcast-simulator:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3001/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/api/health | grep -q '"ok"'
          test "$(curl -sf http://127.0.0.1:3001/api/items)" = '[]'
          curl -sf http://127.0.0.1:3001/api/community/meta | grep -q '"current_version":"v15"'
          # Restart: nothing left to apply.
          docker restart app-pg
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3001/api/health && break
            sleep 1
          done
          docker logs app-pg 2>&1 | grep -q 'Database up to date'

      - name: Container logs
        if: always()
        run: |
          docker logs app || true
          docker logs app-pg || true
