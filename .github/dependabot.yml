version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Gitflow: updates go through develop like any other change.
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 10
    commit-message:
      # chore(deps) / chore(deps-dev): no release triggered by release-please.
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    # Minor/patch bumps batched into one PR per dependency type;
    # majors stay in their own PR. A dependency joins the first group it
    # matches: @tanstack packages move together (react-query-devtools
    # requires the same react-query version).
    groups:
      tanstack:
        patterns: ['@tanstack/*']
        update-types: ['minor', 'patch']
      prod-minor-patch:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      dev-minor-patch:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    ignore:
      # eslint-plugin-react, -import and -jsx-a11y do not support ESLint 10 yet.
      - dependency-name: 'eslint'
        versions: ['>=10']
      # typescript-eslint supports TypeScript < 6.1, and TS 7 has no JS API.
      - dependency-name: 'typescript'
        versions: ['>=7']
      # Dropped by the move to Hono + Drizzle on plain Postgres.
      - dependency-name: 'effect'
      - dependency-name: '@effect/*'
      - dependency-name: '@supabase/supabase-js'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Paris'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      actions:
        patterns: ['*']
