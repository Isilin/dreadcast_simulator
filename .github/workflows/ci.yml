name: 'CI'

# Runs on every PR into develop, and again on develop itself once merged.
# Release PRs are opened with GITHUB_TOKEN, which does not trigger
# pull_request workflows: the push runs keep develop's own state checked
# before its release PR is merged.
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same major as package.json engines (Vercel) and the Docker image.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Enable Corepack (yarn 4.x)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build (TypeScript + Vite)
        run: yarn run build

      - name: Lint
        run: yarn run lint

      - name: Format check
        run: yarn run format:check

      - name: Tests
        run: yarn run test

  # The production image builds and serves the app (front, API docs, health).
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dreadcast-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No database here: the health check must report it (503), the rest
      # must still be served.
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 \
            -e SIMULATOR_SUPABASE_URL=http://127.0.0.1:9 \
            -e SIMULATOR_SUPABASE_ANON_KEY=ci \
            dreadcast-simulator:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/api/docs && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/ | grep -q '<div id="root"'
          curl -sf http://127.0.0.1:3000/communaute | grep -q '<div id="root"'
          curl -sf http://127.0.0.1:3000/api/openapi.json | grep -q 'Dreadcast Simulator API'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/missing.js)" = 404

      - name: Container logs
        if: always()
        run: docker logs app || true
